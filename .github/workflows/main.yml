name: Code Checks
on: push
jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Greeting!
        run: echo hello world

  run-pytests310:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install packages
        run: python -m pip install -e ".[test]"

      - name: Test package
        run: python -m pytest
  
  run-pytests314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install packages
        run: python -m pip install -e ".[test]"

      - name: Test package
        run: python -m pytest
